<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDMS — User & Access Management</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e6ed;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .logo h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
    .logo p  { font-size: .8rem; color: #7ecbff; margin-top: .25rem; }

    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 1.8rem;
    }
    .tab {
      flex: 1;
      padding: .65rem;
      text-align: center;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      color: #8a9bb0;
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .tab.active { color: #7ecbff; border-color: #7ecbff; }

    .form { display: none; flex-direction: column; gap: 1rem; }
    .form.active { display: flex; }

    label { font-size: .78rem; color: #8a9bb0; margin-bottom: .2rem; display: block; }

    input, select {
      width: 100%;
      padding: .65rem .9rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #e0e6ed;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }
    input:focus, select:focus { border-color: #7ecbff; }
    select option { background: #1e3a4a; }

    .field { display: flex; flex-direction: column; }

    button[type="submit"] {
      margin-top: .5rem;
      padding: .75rem;
      background: linear-gradient(90deg, #0072ff, #00c6ff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }
    button[type="submit"]:hover { opacity: .88; }
    button[type="submit"]:disabled { opacity: .5; cursor: not-allowed; }

    .alert {
      padding: .7rem 1rem;
      border-radius: 8px;
      font-size: .82rem;
      display: none;
    }
    .alert.error   { background: rgba(255,80,80,.15); border: 1px solid rgba(255,80,80,.4); color: #ff8080; }
    .alert.success { background: rgba(50,200,100,.15); border: 1px solid rgba(50,200,100,.4); color: #60e090; }
    .alert.show    { display: block; }

    .user-info {
      display: none;
      flex-direction: column;
      gap: .8rem;
      animation: fadeIn .3s;
    }
    .user-info.show { display: flex; }

    .badge {
      display: inline-block;
      padding: .25rem .7rem;
      background: rgba(126,203,255,.15);
      border: 1px solid rgba(126,203,255,.35);
      border-radius: 20px;
      font-size: .78rem;
      color: #7ecbff;
    }

    .info-row { display: flex; justify-content: space-between; font-size: .85rem; }
    .info-row span:first-child { color: #8a9bb0; }

    .token-box {
      background: rgba(0,0,0,.3);
      border-radius: 6px;
      padding: .6rem .8rem;
      font-size: .7rem;
      word-break: break-all;
      color: #7ecbff;
      max-height: 80px;
      overflow-y: auto;
    }

    .logout-btn {
      padding: .55rem;
      background: rgba(255,80,80,.12);
      border: 1px solid rgba(255,80,80,.3);
      border-radius: 8px;
      color: #ff8080;
      font-size: .85rem;
      cursor: pointer;
      transition: background .2s;
    }
    .logout-btn:hover { background: rgba(255,80,80,.22); }

    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>IDMS</h1>
    <p>Module 1 — User &amp; Access Management</p>
  </div>

  <!-- ── Logged-in state ── -->
  <div class="user-info" id="userInfo">
    <div class="info-row"><span>Name</span><span id="uiName">—</span></div>
    <div class="info-row"><span>Email</span><span id="uiEmail">—</span></div>
    <div class="info-row"><span>Role</span><span id="uiRole"><span class="badge">—</span></span></div>
    <div>
      <label>JWT Token</label>
      <div class="token-box" id="uiToken">—</div>
    </div>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>

  <!-- ── Auth forms ── -->
  <div id="authSection">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Sign In</div>
      <div class="tab"        onclick="switchTab('register')">Register</div>
    </div>

    <!-- Login -->
    <form class="form active" id="loginForm" onsubmit="handleLogin(event)">
      <div id="loginAlert" class="alert"></div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@idms.dz" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required />
      </div>
      <button type="submit" id="loginBtn">Sign In</button>
    </form>

    <!-- Register -->
    <form class="form" id="registerForm" onsubmit="handleRegister(event)">
      <div id="registerAlert" class="alert"></div>
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="Amina Khelil" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@idms.dz" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min 8 characters" required />
      </div>
      <div class="field">
        <label>Role</label>
        <select id="regRole">
          <option value="1">Director</option>
          <option value="2">Educator</option>
          <option value="3">Transport Coordinator</option>
          <option value="4">Catering Staff</option>
          <option value="5">Parent</option>
        </select>
      </div>
      <button type="submit" id="registerBtn">Create Account</button>
    </form>
  </div>
</div>

<script>
  const API = '';

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (i===0) === (tab==='login')));
    document.getElementById('loginForm').classList.toggle('active', tab === 'login');
    document.getElementById('registerForm').classList.toggle('active', tab === 'register');
    clearAlerts();
  }

  function showAlert(id, type, msg) {
    const el = document.getElementById(id);
    el.className = `alert ${type} show`;
    el.textContent = msg;
  }

  function clearAlerts() {
    document.querySelectorAll('.alert').forEach(el => el.className = 'alert');
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    clearAlerts();
    try {
      const res  = await fetch(`${API}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email:    document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value,
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || (data.errors||[]).join(' '));
      showLoggedIn(data.token, data.user);
    } catch (err) {
      showAlert('loginAlert', 'error', err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    clearAlerts();
    try {
      const res  = await fetch(`${API}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullName: document.getElementById('regName').value,
          email:    document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
          roleId:   Number(document.getElementById('regRole').value),
        }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || (data.errors||[]).join(' '));
      showAlert('registerAlert', 'success', `Account created (ID: ${data.userId}). You can now sign in.`);
      switchTab('login');
    } catch (err) {
      showAlert('registerAlert', 'error', err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  }

  function showLoggedIn(token, user) {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('uiName').textContent  = user.fullName;
    document.getElementById('uiEmail').textContent = user.email;
    document.getElementById('uiRole').innerHTML    = `<span class="badge">${user.role}</span>`;
    document.getElementById('uiToken').textContent = token;
    document.getElementById('userInfo').classList.add('show');
    localStorage.setItem('idms_token', token);
    localStorage.setItem('idms_user',  JSON.stringify(user));
  }

  function logout() {
    localStorage.removeItem('idms_token');
    localStorage.removeItem('idms_user');
    document.getElementById('userInfo').classList.remove('show');
    document.getElementById('authSection').style.display = '';
    switchTab('login');
  }

  // Restore session on page load
  const saved = localStorage.getItem('idms_token');
  if (saved) {
    try { showLoggedIn(saved, JSON.parse(localStorage.getItem('idms_user'))); } catch(_) { logout(); }
  }
</script>
</body>
</html>
